version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5005:5005"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/product-store
      - JWT_SECRET=your_jwt_secret_here
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5005
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: 